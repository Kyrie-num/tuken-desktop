[package]
name = "tuken"
version = "0.3.5"
description = "兔啃桌面客户端"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tuken_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
# unstable: pages shown inside the main window (src/panel.rs) need child webviews.
# macos-private-api: the see-through window behind macOS vibrancy (does
# nothing elsewhere).
tauri = { version = "2.8.2", features = ["tray-icon", "image-png", "unstable", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# ~2.12: later versions need Tauri 2.12. Rustls like the rest of the app; the
# system proxy, for users who reach GitHub through one.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps the key order of the user's Claude config files.
serde_json = { version = "1.0", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "charset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "net", "io-util"] }
log = "0.4"
chrono = "0.4"
url = "2.5"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4"] }
dirs = "5.0"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# The vault's key in the login keychain (added, never replaced), sealing it
# with AES-256-GCM. Tauri and rustls already build all of these for macOS.
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
ring = "0.17"
libc = "0.2"
plist = "1"
objc2 = "0.6"
# Claude Desktop's disk image comes through the system proxy (ClashX, Surge…).
# Already on through the updater's system-proxy (hyper-util is shared); said
# here so it stays on. Windows is left exactly as it was.
reqwest = { version = "0.12", default-features = false, features = ["system-proxy"] }

[dev-dependencies]
# The macOS vault format and Claude.app's Info.plist are tested everywhere.
ring = "0.17"
plist = "1"

[target.'cfg(windows)'.dependencies]
zstd = "0.13"
winreg = "0.52"
windows = { version = "0.61", features = ["Foundation", "Management_Deployment", "Win32_System_WinRT"] }
windows-future = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = "symbols"
