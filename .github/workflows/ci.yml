name: 检查

on:
  push:
    branches: [main, macos]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The version in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # The Rust build embeds the built pages.
      - run: pnpm build:renderer
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The same checks on a Mac, and whether a copy signed anew (as an update
  # of 兔啃 is) gets the vault key unasked. (Claude Desktop itself: e2e.yml.)
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:renderer
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: The keychain after an update
        working-directory: src-tauri
        run: cargo test macos_keychain -- --ignored --nocapture

  # The universal disk image as a download of the run (no release), for main,
  # tags and runs by hand. Built without update files: those need the
  # release signing key.
  dmg:
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Look inside
        working-directory: src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          app=macos/Tuken.app
          ls -la macos dmg
          plutil -p "$app/Contents/Info.plist"
          plutil -p "$app/Contents/Resources/zh-Hans.lproj/InfoPlist.strings"
          lipo -info "$app"/Contents/MacOS/*
          codesign -dv --verbose=4 "$app" 2>&1
          codesign --verify --deep --strict --verbose=2 "$app"
          # Without a Developer ID, Gatekeeper turns it down.
          spctl --assess --type execute -vv "$app" || true
          du -sh "$app" dmg/*.dmg
          hdiutil imageinfo dmg/*.dmg | grep -E "Format|Checksum Type|Total Bytes" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tuken-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # The disk image on each macOS that GitHub has, Intel included: 兔啃 must
  # start, and a picture of each shows how it looks there.
  smoke:
    needs: dmg
    strategy:
      fail-fast: false
      # GitHub runs 5 macOS jobs at once on this plan.
      max-parallel: 3
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Tuken-macos-universal
      - name: Open 兔啃
        run: |
          sw_vers
          uname -m
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" Tuken_*_universal.dmg
          ls "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/dmg/Tuken.app" "$RUNNER_TEMP/Tuken.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          open "$RUNNER_TEMP/Tuken.app"
          sleep 20
          pgrep -fl "Tuken.app/Contents/MacOS/tuken"
          screencapture -x "$RUNNER_TEMP/tuken-${{ matrix.os }}.png"
          pkill -f "Tuken.app/Contents/MacOS/tuken" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tuken-screenshot-${{ matrix.os }}
          path: ${{ runner.temp }}/tuken-${{ matrix.os }}.png
